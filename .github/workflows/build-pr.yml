name: bluebuild-pr
on:
  pull_request:
    branches:
      - main
  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # paths-filter uses the API to list PR files
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # a file counts as a match only if it passes ALL rules below
          predicate-quantifier: every
          filters: |
            build:
              - '**'
              - '!**.md'
              - '!.devcontainer/**'
              - '!.github/workflows/renovate.yaml'
              - '!.github/workflows/sync_codeberg.yaml'
              - '!docs/**'
              - '!files/system/usr/share/ublue-os/**'

  bluebuild:
    name: Verify Image Build
    needs: changes
    # always build on manual dispatch; otherwise only when relevant files changed
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      BB_BUILD_DRIVER: podman
      BB_RUN_DRIVER: podman
      BB_INSPECTOR_DRIVER: skopeo
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - recipe-base.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Verify Image Build
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          # Dependabot (and fork) PRs do not receive repository secrets, so
          # SIGNING_SECRET is empty and BlueBuild cannot find a cosign key.
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          push: ${{ secrets.SIGNING_SECRET != '' }}
          build_opts: ${{ secrets.SIGNING_SECRET == '' && '--no-sign' || ' ' }}

  build-status:
    name: Build Status
    needs: [changes, bluebuild]
    if: always() # run even when bluebuild is skipped or fails
    runs-on: ubuntu-24.04
    steps:
      - name: Check build results
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "bluebuild: ${{ needs.bluebuild.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Build verification failed."
            exit 1
          fi
          echo "Build passed or was not required."
