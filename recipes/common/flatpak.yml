---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.github.wwmm.easyeffects # Audio effects and EQ
          - it.mijorus.gearlever # Manage AppImages
          - net.codelogistics.webapps # Manage Web Apps
          - io.podman_desktop.PodmanDesktop # GUI for managing containers
          - com.github.tchx84.Flatseal # GUI for managing Flatpak permissions

      # Add Flathub user repo
      - notify: false
        scope: user

      # Add ArtCraft user repo
      #- notify: false
      #  scope: user
      #  repo:
      #    url: https://getartcraft.com/artcraft-oci.flatpakrepo
      #    name: artcraft-oci
      #    title: ArtCraft

  - type: systemd
    system:
      enabled:
        - flatpak-default-apps.service
