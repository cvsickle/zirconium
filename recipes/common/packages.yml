---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Fedora packages
  - type: dnf
    install:
      packages:
        - chrony
        - neovim
        - tree-sitter-cli
        - ripgrep
        - fd-find
        - adw-gtk3-theme
        - qt6ct
        - breeze-cursor-theme
        - docker-cli
        - podman-compose
        - file-roller
        - rbw
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon
    remove:
      packages:
        - hyfetch
        - fcitx5
        - fcitx5-chinese-addons
        - fcitx5-mozc
        - fcitx5-rime
        - fcitx5-configtool
        - fcitx5-data
        - fcitx5-gtk
        - fcitx5-gtk3
        - fcitx5-gtk4
        - fcitx5-libs
        - fcitx5-lua
        - fcitx5-qt
        - fcitx5-qt-libfcitx5qt6widgets
        - fcitx5-qt-libfcitx5qtdbus
        - fcitx5-qt-qt6gui
        - fcitx5-qt5
        - fcitx5-qt6
        - fcitx5-chinese-addons-data
        - brise
        - libime
        - libime-data
        - xcb-imdkit
        - minizip-ng-compat
        - re2
        - qt6-qtpdf
        - qt6-qtpositioning
        - qt6-qtserialport
        - qt6-qtwebchannel
        - qt6-qtwebengine
        - valent
      auto-remove: true

  # Keyed packages
  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
        - https://repos.fyralabs.com/terra$releasever/key.asc
      cleanup: true
    install:
      packages:
        - code
        - nwg-look
        - tailscale

  # Universal Blue
  - type: dnf
    repos:
      copr:
        - ublue-os/packages
      cleanup: true
    install:
      packages:
        - ublue-setup-services

  # Starship
  - type: dnf
    repos:
      copr:
        - atim/starship
      cleanup: true
    install:
      packages:
        - starship

  # Lazygit
  - type: dnf
    repos:
      copr:
        - dejan/lazygit
      cleanup: true
    install:
      packages:
        - lazygit

  # Helium browser
  - type: dnf
    repos:
      copr:
        - imput/helium
      cleanup: true
    install:
      packages:
        - helium-bin

  # Dank Linux Packages
  - type: dnf
    repos:
      copr:
        - avengemedia/danklinux
      cleanup: true
    install:
      packages:
        - dankcalendar-git
