---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      copr:
        - atim/starship
        - dejan/lazygit
        - imput/helium
        - ublue-os/packages
      nonfree: rpmfusion
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      cleanup: true
    install:
      packages:
        - chrony

        - neovim
        - lazygit
        - tree-sitter-cli
        - ripgrep
        - fd-find
        - fastfetch
        - starship
        - btop

        - sassc
        - sass
        - gtk-murrine-engine
        - breeze-cursor-theme

        - helium-bin

        - docker-cli
        - podman-compose

        - code
        - ublue-setup-services
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon
    remove:
      packages:
        - hyfetch
        - fcitx5
        - fcitx5-chinese-addons
        - fcitx5-mozc
        - fcitx5-rime
        - fcitx5-configtool
        - fcitx5-data
        - fcitx5-gtk
        - fcitx5-gtk2
        - fcitx5-gtk3
        - fcitx5-gtk4
        - fcitx5-libs
        - fcitx5-lua
        - fcitx5-qt
        - fcitx5-qt-libfcitx5qt6widgets
        - fcitx5-qt-libfcitx5qtdbus
        - fcitx5-qt-qt6gui
        - fcitx5-qt5
        - fcitx5-qt6
        - fcitx5-chinese-addons-data
        - brise
        - libime
        - libime-data
        - xcb-imdkit
        - minizip-ng-compat
        - re2
        - qt6-qtpdf
        - qt6-qtpositioning
        - qt6-qtserialport
        - qt6-qtwebchannel
        - qt6-qtwebengine
        - valent
      auto-remove: true
