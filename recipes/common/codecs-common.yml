---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Full multimedia stack (x86_64 only)
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      allow-erasing: true
      packages:
        # ffmpeg (full)
        - ffmpeg
        # GStreamer core
        - gstreamer1
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - gstreamer1-plugins-good-extras
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugin-openh264
        # GStreamer restricted (RPM Fusion)
        - gstreamer1-plugins-ugly
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugin-libav
        - libheif-freeworld
        # VA-API plumbing + diagnostics
        - libva
        - libva-utils
        # Intel VA-API driver
        - intel-media-driver
        - intel-gmmlib
        # AMD VA-API driver
        - mesa-va-drivers-freeworld
        # Bluetooth audio codecs
        - pipewire-codec-aptx

  # Verify codec stack
  - type: script
    snippets:
      - |
        set -euo pipefail
        echo "Verifying codec stack..."
        for pkg in ffmpeg ffmpeg-libs intel-media-driver \
                   mesa-va-drivers-freeworld \
                   gstreamer1-plugins-ugly gstreamer1-plugins-bad-freeworld \
                   libheif-freeworld; do
          rpm -q "$pkg" >/dev/null || { echo "MISSING: $pkg"; exit 1; }
        done
        # Fail if any -free ffmpeg lib survived the swap
        # (capture first to avoid SIGPIPE under pipefail)
        leftovers="$(rpm -qa --qf '%{NAME}\n' | grep -E '^(libav|libsw|libpostproc).*-free$' || true)"
        if [ -n "$leftovers" ]; then
          echo "ERROR: crippled -free ffmpeg libs still present:"
          echo "$leftovers"; exit 1
        fi
        # Fedora's limited mesa-va-drivers must have been replaced
        if rpm -q mesa-va-drivers >/dev/null 2>&1; then
          echo "ERROR: mesa-va-drivers still installed alongside freeworld"; exit 1
        fi
        # Fail if mesa versions drifted (freeworld must match base mesa)
        base="$(rpm -q --qf '%{VERSION}\n' mesa-dri-drivers)"
        va="$(rpm -q --qf '%{VERSION}\n' mesa-va-drivers-freeworld)"
        echo "mesa-dri-drivers=$base mesa-va-drivers-freeworld=$va"
        [ "$base" = "$va" ] || { echo "ERROR: mesa version mismatch"; exit 1; }
        echo "Codec stack OK"
