---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: zirconium-nvidia
# description will be included in the image's metadata
description: CVSickle Zirconium

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/zirconium-dev/zirconium-nvidia
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # Add system files.
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Install packages.
  - from-file: common/packages.yml

  # Install media codecs.
  - from-file: common/codecs-common.yml
  - from-file: common/codecs-nvidia.yml

  # Install fonts.
  - from-file: common/fonts.yml

  # Install flatpaks.
  - from-file: common/flatpak.yml

  # Install brew packages.
  - from-file: common/brew.yml

  # Install misc. stuff.
  - from-file: common/misc.yml

  # Update systemd configuration.
  - from-file: common/system.yml

  # Update the os-release.
  - from-file: common/os-release.yml

  # Add signing configuration.
  - type: signing
